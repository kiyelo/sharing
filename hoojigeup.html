<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>후지급 템플릿 생성기</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 920px;
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    .desc {
      color: #666;
      margin: 0 0 20px;
      line-height: 1.5;
      font-size: 14px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e2e2dc;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d8d8d2;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      background: #fff;
      line-height: 1.55;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
    }

    input {
      margin-bottom: 14px;
    }

    #source {
      min-height: 180px;
    }

    #titleResult {
      min-height: 52px;
    }

    #bodyResult {
      min-height: 340px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2f6fed;
      color: white;
    }

    button.secondary {
      background: #444;
    }

    button.ghost {
      background: #e9e9e4;
      color: #222;
    }

    .toast {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e8f4ea;
      color: #1f6b35;
      font-weight: 700;
      font-size: 14px;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff0f0;
      color: #a33;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>후지급 템플릿 생성기</h1>
  <p class="desc">
    요청 문구를 붙여넣고 참조 URL을 입력하면 ITSM 제목/내용 템플릿을 자동 생성합니다.
  </p>

  <div class="panel">
    <label for="source">요청 원문</label>
    <textarea id="source" placeholder="여기에 후지급 요청 내용을 붙여넣으세요."></textarea>

    <label for="referUrl" style="margin-top: 16px;">참조 URL</label>
    <input id="referUrl" type="url" placeholder="https://kgmcpo.kg-mobility.com/..." />

    <div class="buttons">
      <button onclick="generate()">템플릿 생성</button>
      <button class="ghost" onclick="clearAll()">초기화</button>
    </div>

    <div id="error" class="error"></div>
  </div>

  <div class="panel">
    <label for="titleResult">제목</label>
    <textarea id="titleResult" readonly placeholder="생성된 제목이 여기에 표시됩니다."></textarea>

    <label for="bodyResult" style="margin-top: 16px;">내용</label>
    <textarea id="bodyResult" readonly placeholder="생성된 내용이 여기에 표시됩니다."></textarea>

    <div class="buttons">
      <button class="secondary" onclick="copyTitle()">제목 복사</button>
      <button class="secondary" onclick="copyBody()">내용 복사</button>
      <button class="secondary" onclick="copyAll()">제목+내용 복사</button>
    </div>

    <div id="toast" class="toast">복사했어요.</div>
  </div>

  <script>
    function clean(value) {
      return String(value || "")
        .replace(/^▶\s*/, "")
        .trim();
    }

    function normalizeInputText(text) {
      return String(text || "")
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/&nbsp;/gi, " ");
    }

    function getValueByLabel(text, label) {
      const normalized = normalizeInputText(text);
      const pattern = new RegExp(label + "\\s*[:：]\\s*([^\\n\\r]+)", "i");
      const match = normalized.match(pattern);
      return match ? clean(match[1]) : "";
    }

    function extractReason(text) {
      const normalized = normalizeInputText(text);

      const titlePattern = /후\s*지급\s*요청\s*[\(（]\s*([^)）]+?)\s*[\)）]/i;
      const titleMatch = normalized.match(titlePattern);

      if (titleMatch && titleMatch[1]) {
        return clean(titleMatch[1]);
      }

      const labelReason = getValueByLabel(normalized, "지급\\s*사유");
      if (labelReason) {
        return labelReason;
      }

      return "";
    }

    function normalizeBank(value) {
      const bank = clean(value).replace(/\s/g, "");

      const bankMap = {
        "국민": "국민은행",
        "국민은행": "국민은행",
        "신한": "신한은행",
        "신한은행": "신한은행",
        "우리": "우리은행",
        "우리은행": "우리은행",
        "하나": "하나은행",
        "하나은행": "하나은행",
        "농협": "농협은행",
        "농협은행": "농협은행",
        "기업": "기업은행",
        "기업은행": "기업은행",
        "카카오": "카카오뱅크",
        "카카오뱅크": "카카오뱅크",
        "토스": "토스뱅크",
        "토스뱅크": "토스뱅크",
        "케이": "케이뱅크",
        "케이뱅크": "케이뱅크"
      };

      return bankMap[bank] || clean(value);
    }

    function normalizeAccount(value) {
      return clean(value).replace(/[^0-9]/g, "");
    }

    function formatAmount(value) {
      const onlyNumber = clean(value).replace(/[^0-9]/g, "");

      if (!onlyNumber) return "";

      return Number(onlyNumber).toLocaleString("ko-KR");
    }

    function validate(fields) {
      const missing = [];

      if (!fields.contractNo) missing.push("계약번호");
      if (!fields.carRegNo) missing.push("차량번호");
      if (!fields.accountNo) missing.push("입금계좌");
      if (!fields.bank) missing.push("입금은행");
      if (!fields.holder) missing.push("예금주");
      if (!fields.amount) missing.push("입금액");
      if (!fields.reason) missing.push("지급 사유");
      if (!fields.referUrl) missing.push("참조 URL");

      return missing;
    }

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function hideError() {
      const error = document.getElementById("error");
      error.textContent = "";
      error.style.display = "none";
    }

    function generate() {
      hideError();

      const text = document.getElementById("source").value;
      const referUrl = document.getElementById("referUrl").value.trim();

      const fields = {
        contractNo: getValueByLabel(text, "계약번호"),
        carRegNo: getValueByLabel(text, "차량번호"),
        accountNo: normalizeAccount(getValueByLabel(text, "입금계좌")),
        bank: normalizeBank(getValueByLabel(text, "입금은행")),
        holder: getValueByLabel(text, "예금주"),
        amount: formatAmount(getValueByLabel(text, "입금액")),
        reason: extractReason(text),
        referUrl: referUrl
      };

      const missing = validate(fields);

      if (missing.length > 0) {
        showError("누락된 항목이 있어요: " + missing.join(", "));
        document.getElementById("titleResult").value = "";
        document.getElementById("bodyResult").value = "";
        return;
      }

      const title = `[ITSM 긴급] Request for editing '후 지급' data (${fields.contractNo})`;

      const body = `I received the request for the '후 지급'
Please check ${fields.contractNo}

상태 col: 결재대기
구분 col: 후지급
출금금액 col: ${fields.amount}
계약서번호 col:
${fields.contractNo}
CAR_REG_NO : ${fields.carRegNo}
other cols > Refer to this contract
${fields.referUrl}

은행 col: ${fields.bank}
계좌번호 col:
${fields.accountNo}
예금주 col: ${fields.holder}
신청 유형: 기타
지급 사유 col: ${fields.reason}`;

      document.getElementById("titleResult").value = title;
      document.getElementById("bodyResult").value = body;
    }

    async function copyText(text) {
      if (!text.trim()) return;

      await navigator.clipboard.writeText(text);
      showToast();
    }

    function copyTitle() {
      copyText(document.getElementById("titleResult").value);
    }

    function copyBody() {
      copyText(document.getElementById("bodyResult").value);
    }

    function copyAll() {
      const title = document.getElementById("titleResult").value;
      const body = document.getElementById("bodyResult").value;

      copyText(`제목
${title}

내용
${body}`);
    }

    function clearAll() {
      hideError();

      document.getElementById("source").value = "";
      document.getElementById("referUrl").value = "";
      document.getElementById("titleResult").value = "";
      document.getElementById("bodyResult").value = "";
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 1500);
    }
  </script>
</body>
</html>
