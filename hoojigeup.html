<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>후지급 템플릿 생성기</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 32px auto;
      padding: 0 20px;
      background: #f7f7f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .desc {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d8d8d2;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      background: #fff;
      resize: vertical;
    }

    textarea {
      min-height: 260px;
      line-height: 1.5;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .panel {
      background: white;
      border: 1px solid #e2e2dc;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2f6fed;
      color: white;
    }

    button.secondary {
      background: #444;
    }

    button.ghost {
      background: #e9e9e4;
      color: #222;
    }

    .small {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      margin-top: 8px;
    }

    .result-title {
      min-height: 42px;
    }

    .toast {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e8f4ea;
      color: #1f6b35;
      font-weight: 700;
      font-size: 14px;
    }

    .warn {
      background: #fff6df;
      color: #7a5200;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <h1>후지급 템플릿 생성기</h1>
  <p class="desc">
    요청 문구를 붙여넣으면 계약번호, 차량번호, 계좌, 은행, 예금주, 금액, 지급 사유를 추출해서
    ITSM 요청 템플릿으로 변환합니다.
  </p>

  <div class="grid">
    <div class="panel">
      <label for="source">요청 원문</label>
      <textarea id="source">후지급 요청(올드카 책임보험 가입료)
▶ 계약번호 : KG-P-03421호
▶ 차량번호 : 78마5846
▶ 입금계좌 : 242090-78-031505
▶ 입금은행 : 국민
▶ 예금주 : DB손해보험
▶ 입금액 : 25,600원</textarea>

      <div class="buttons">
        <button onclick="parseSource()">템플릿 채우기</button>
        <button class="ghost" onclick="clearAll()">초기화</button>
      </div>

      <p class="small">
        계좌번호는 자동으로 하이픈을 제거합니다. 예: 242090-78-031505 → 24209078031505
      </p>
    </div>

    <div class="panel">
      <div class="warn">
        아래 값은 필요하면 직접 수정할 수 있어요.  
        특히 “참조 계약번호”와 “참조 URL”은 원문에 없으면 비워둔 상태로 생성됩니다.
      </div>

      <div class="field-group">
        <label for="contractNo">계약번호</label>
        <input id="contractNo" />
      </div>

      <div class="field-group">
        <label for="carRegNo">차량번호</label>
        <input id="carRegNo" />
      </div>

      <div class="field-group">
        <label for="bank">입금은행</label>
        <input id="bank" />
      </div>

      <div class="field-group">
        <label for="accountNo">입금계좌</label>
        <input id="accountNo" />
      </div>

      <div class="field-group">
        <label for="holder">예금주</label>
        <input id="holder" />
      </div>

      <div class="field-group">
        <label for="amount">입금액</label>
        <input id="amount" />
      </div>

      <div class="field-group">
        <label for="reason">지급 사유</label>
        <input id="reason" />
      </div>

      <div class="field-group">
        <label for="referContractNo">참조 계약번호 / Please check</label>
        <input id="referContractNo" placeholder="예: KG-P-03435호" />
      </div>

      <div class="field-group">
        <label for="referUrl">참조 URL</label>
        <input id="referUrl" placeholder="https://..." />
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top: 20px;">
    <label for="titleResult">제목</label>
    <textarea id="titleResult" class="result-title" readonly></textarea>

    <label for="bodyResult" style="margin-top: 16px;">내용</label>
    <textarea id="bodyResult" readonly></textarea>

    <div class="buttons">
      <button onclick="generateTemplate()">결과 다시 생성</button>
      <button class="secondary" onclick="copyTitle()">제목 복사</button>
      <button class="secondary" onclick="copyBody()">내용 복사</button>
      <button class="secondary" onclick="copyAll()">제목+내용 복사</button>
    </div>

    <div id="toast" class="toast">복사했어요.</div>
  </div>

  <script>
    function getValueByLabel(text, label) {
      const pattern = new RegExp(label + "\\s*[:：]\\s*([^\\n\\r]+)", "i");
      const match = text.match(pattern);
      return match ? clean(match[1]) : "";
    }

    function clean(value) {
      return String(value || "")
        .replace(/^▶\s*/, "")
        .trim();
    }

    function normalizeBank(value) {
      let bank = clean(value);

      const bankMap = {
        "국민": "국민은행",
        "국민은행": "국민은행",
        "신한": "신한은행",
        "우리": "우리은행",
        "하나": "하나은행",
        "농협": "농협은행",
        "기업": "기업은행",
        "카카오": "카카오뱅크",
        "토스": "토스뱅크",
        "케이": "케이뱅크"
      };

      return bankMap[bank] || bank;
    }

    function normalizeAccount(value) {
      return clean(value).replace(/[^0-9]/g, "");
    }

    function normalizeAmount(value) {
      return clean(value)
        .replace(/원/g, "")
        .replace(/\s/g, "")
        .trim();
    }

    function extractReason(text) {
      const match = text.match(/후지급\s*요청\s*\(([^)]+)\)/);
      return match ? clean(match[1]) : "";
    }

    function parseSource() {
      const text = document.getElementById("source").value;

      document.getElementById("contractNo").value = getValueByLabel(text, "계약번호");
      document.getElementById("carRegNo").value = getValueByLabel(text, "차량번호");
      document.getElementById("accountNo").value = normalizeAccount(getValueByLabel(text, "입금계좌"));
      document.getElementById("bank").value = normalizeBank(getValueByLabel(text, "입금은행"));
      document.getElementById("holder").value = getValueByLabel(text, "예금주");
      document.getElementById("amount").value = normalizeAmount(getValueByLabel(text, "입금액"));
      document.getElementById("reason").value = extractReason(text);

      generateTemplate();
    }

    function generateTemplate() {
      const contractNo = document.getElementById("contractNo").value.trim();
      const carRegNo = document.getElementById("carRegNo").value.trim();
      const bank = document.getElementById("bank").value.trim();
      const accountNo = normalizeAccount(document.getElementById("accountNo").value);
      const holder = document.getElementById("holder").value.trim();
      const amount = normalizeAmount(document.getElementById("amount").value);
      const reason = document.getElementById("reason").value.trim();
      const referContractNo = document.getElementById("referContractNo").value.trim();
      const referUrl = document.getElementById("referUrl").value.trim();

      document.getElementById("accountNo").value = accountNo;
      document.getElementById("amount").value = amount;

      const title = `[ITSM 긴급] Request for editing '후 지급' data (${contractNo})`;

      const checkLine = referContractNo
        ? `Please check ${referContractNo}`
        : `Please check`;

      const urlLine = referUrl
        ? referUrl
        : "[참조 URL 입력]";

      const body = `I received the request for the '후 지급'
${checkLine}

상태 col: 결재대기
구분 col: 후지급
출금금액 col: ${amount}
계약서번호 col:
${contractNo}
CAR_REG_NO : ${carRegNo}
other cols > Refer to this contract
${urlLine}

은행 col: ${bank}
계좌번호 col:
${accountNo}
예금주 col: ${holder}
신청 유형: 기타
지급 사유 col: ${reason}`;

      document.getElementById("titleResult").value = title;
      document.getElementById("bodyResult").value = body;
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
      showToast();
    }

    function copyTitle() {
      copyText(document.getElementById("titleResult").value);
    }

    function copyBody() {
      copyText(document.getElementById("bodyResult").value);
    }

    function copyAll() {
      const title = document.getElementById("titleResult").value;
      const body = document.getElementById("bodyResult").value;
      copyText(`제목
${title}

내용
${body}`);
    }

    function clearAll() {
      const ids = [
        "source",
        "contractNo",
        "carRegNo",
        "bank",
        "accountNo",
        "holder",
        "amount",
        "reason",
        "referContractNo",
        "referUrl",
        "titleResult",
        "bodyResult"
      ];

      ids.forEach(id => {
        document.getElementById(id).value = "";
      });
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 1600);
    }

    parseSource();
  </script>
</body>
</html>
