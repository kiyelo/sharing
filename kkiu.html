<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Kkiu To Do</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendard-variable.css"/>
<style>
  :root{
    --paper:#fbf8f2; --surface:#fff; --ink:#1c1a17; --ink2:#5c564e; --sub:#938c80; --faint:#bdb6a8;
    --hair:#efe9dd; --accent:#e0894a; --accent-soft:#fbebda; --accent-ink:#b5662b; --danger:#c75b4e;
    --r:16px; --nav-h:64px;
    --sh-card:0 1px 2px rgba(70,55,30,.05),0 4px 14px rgba(70,55,30,.05);
    --sh-slot:0 12px 30px rgba(80,55,25,.14); --sh-pop:0 26px 70px rgba(50,40,20,.22);
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
    background:linear-gradient(168deg,#efe9dd,#f7f2e9 46%,#ece5d8);display:grid;place-items:center;padding:24px 14px}
  button,input,textarea{font:inherit;color:inherit}
  button{-webkit-tap-highlight-color:transparent;cursor:pointer;border:0;background:none}
  .wrap{width:min(100%,416px)}
  .phone{position:relative;width:100%;height:min(884px,calc(100vh - 48px));min-height:680px;display:flex;flex-direction:column;
    overflow:hidden;border-radius:46px;background:var(--paper);border:1px solid rgba(70,55,30,.06);box-shadow:var(--sh-pop)}
  .phone::before{content:"";position:absolute;z-index:60;top:12px;left:50%;width:104px;height:28px;transform:translateX(-50%);border-radius:999px;background:rgba(70,55,30,.05)}
  #app{flex:1;display:flex;flex-direction:column;min-height:0}

  .head{flex:none;padding:46px 24px 14px}
  .ttl{margin:0;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
  .head-sub{margin:7px 0 0;font-size:13px;font-weight:560;color:var(--sub);letter-spacing:-.01em}

  .stage{flex:1;min-height:0;position:relative;overflow:hidden}
  .qvp{position:absolute;inset:0;overflow:hidden;touch-action:none}
  .qtrack{position:absolute;left:0;right:0;top:0;padding:0 18px;will-change:transform}
  .qfade{position:absolute;left:0;right:0;z-index:6;pointer-events:none}
  .qfade.t{top:0;height:46px;background:linear-gradient(to bottom,var(--paper) 16%,transparent)}
  .qfade.b{bottom:0;height:calc(var(--nav-h) + 56px);background:linear-gradient(to top,var(--paper) 44%,transparent)}

  .card{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:13px;align-items:center;height:60px;
    margin-bottom:10px;padding:0 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-card);
    user-select:none;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .16s,opacity .16s}
  .qtrack .card{transition:transform .19s cubic-bezier(.2,.7,.3,1),box-shadow .16s,opacity .16s}
  .card.drag{opacity:.4}
  .card.sel-on{box-shadow:0 0 0 2px var(--accent),var(--sh-card)}
  .ck{width:23px;height:23px;border-radius:50%;border:2px solid #e3ddd0;background:transparent;display:grid;place-items:center;color:transparent;transition:.15s}
  .ck:hover{border-color:var(--accent)}
  .ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ck svg{width:12px;height:12px}
  .selbox{width:23px;height:23px;border-radius:7px;border:2px solid #e3ddd0;display:grid;place-items:center;color:transparent}
  .selbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .selbox svg{width:13px;height:13px}
  .mid{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .trow{display:flex;align-items:center;gap:7px;min-width:0}
  .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .t-title{margin:0;font-size:15px;font-weight:560;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.t1 .t-title{font-weight:640}
  .t-title[contenteditable="true"]{outline:none;border-bottom:2px solid var(--accent);overflow:visible}
  .card.done .t-title{color:var(--faint);text-decoration:line-through}
  .card.done{box-shadow:none;background:rgba(255,255,255,.55)}
  .sub{margin-top:2px;font-size:11px;font-weight:560;color:var(--faint)}
  .acts{display:flex;align-items:center;gap:1px}
  .ico{width:30px;height:30px;border-radius:9px;color:var(--faint);display:grid;place-items:center;opacity:.7;transition:.14s}
  .ico:hover{background:#f4eee2;color:var(--ink2);opacity:1}
  .ico.fav.on{color:var(--accent);opacity:1}
  .ico svg{width:16px;height:16px;pointer-events:none}
  .grip{cursor:grab;touch-action:none}

  .slotwrap{position:absolute;left:0;right:0;z-index:8;transform:translateY(-50%);padding:0 18px}
  .slot{position:relative;display:grid;grid-template-columns:44px 1fr 44px;gap:13px;align-items:center;padding:12px;
    border-radius:18px;background:var(--surface);box-shadow:var(--sh-slot)}
  .slot.thunk{animation:thunk .24s ease}
  @keyframes thunk{42%{transform:scale(.985)}100%{transform:none}}
  .sbadge{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
  .sbadge svg{width:20px;height:20px}
  .sbody{min-width:0}
  .si{width:100%;height:26px;border:0;outline:0;background:transparent;font-size:16px;font-weight:560;letter-spacing:-.02em}
  .si::placeholder{color:var(--faint);font-weight:500}
  .snote{margin-top:2px;font-size:11.5px;font-weight:560;color:var(--sub);letter-spacing:-.01em}
  .snote b{color:var(--accent-ink);font-weight:800}
  .save{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px rgba(224,137,74,.32);transition:.15s}
  .save:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .save svg{width:19px;height:19px}

  .scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:6px 18px calc(var(--nav-h) + 28px)}
  .scroller::-webkit-scrollbar{display:none}
  .list{display:flex;flex-direction:column;gap:10px}
  .list .card{height:auto;min-height:60px;padding:12px 16px;margin:0}
  .list .t-title{white-space:normal;overflow-wrap:anywhere}
  .empty{display:grid;place-items:center;min-height:230px;padding:16px}
  .empty-c{width:100%;padding:30px 26px;border-radius:20px;background:var(--surface);box-shadow:var(--sh-card);text-align:center}
  .empty-c h3{margin:0 0 7px;font-size:18px;font-weight:680;letter-spacing:-.03em}
  .empty-c p{margin:0;font-size:13px;line-height:1.6;font-weight:560;color:var(--sub);word-break:keep-all}
  .pcard{padding:17px 18px;border-radius:18px;background:var(--surface);box-shadow:var(--sh-card)}
  .pcard h3{margin:0 0 6px;font-size:15px;font-weight:680;letter-spacing:-.02em}
  .pcard p{margin:0;font-size:12.5px;line-height:1.6;font-weight:560;color:var(--sub);word-break:keep-all}
  .field{width:100%;background:var(--surface);border:0;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:560;outline:0;box-shadow:var(--sh-card)}
  .field:focus{box-shadow:0 0 0 2px var(--accent),var(--sh-card)}
  textarea.field{min-height:100px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
  .rbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;box-shadow:var(--sh-card);color:var(--ink)}
  .rbtn span{color:var(--faint)}
  .rbtn:hover{color:var(--accent-ink)}
  .rbtn.danger:hover{color:var(--danger)}
  mark{background:var(--accent-soft);border-radius:4px;padding:0 2px;color:var(--accent-ink)}

  .selbar{position:absolute;left:18px;right:18px;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px 10px 16px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:var(--sh-slot)}
  .selbar b{font-size:13px;font-weight:700}
  .sb-acts{display:flex;gap:7px}
  .sb-btn{border-radius:11px;padding:9px 13px;font-size:12px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
  .sb-btn.del{background:var(--danger)}

  .nav{position:absolute;left:16px;right:16px;bottom:16px;z-index:50;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:22px;background:rgba(251,248,242,.82);box-shadow:0 14px 36px rgba(60,45,25,.14);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5)}
  .nb{position:relative;border-radius:16px;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:-.01em;transition:.16s}
  .nb svg{width:21px;height:21px}
  .nb.on{background:var(--accent-soft);color:var(--accent-ink)}

  .toast{position:absolute;left:50%;bottom:92px;z-index:80;transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100% - 40px);padding:11px 17px;border-radius:999px;background:rgba(28,26,23,.94);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;transition:.2s;backdrop-filter:blur(10px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .note{margin:13px auto 0;max-width:416px;text-align:center;font-size:12px;line-height:1.5;font-weight:560;color:rgba(70,55,30,.5);word-break:keep-all}
  @media(max-width:460px){body{padding:0;background:var(--paper)}.wrap{width:100%}.phone{height:100vh;min-height:100vh;border-radius:0;border:0;box-shadow:none}.phone::before,.note{display:none}.head{padding-top:30px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="phone"><div id="app"></div><div class="toast" id="toast"></div></section>
  <p class="note">localStorage 저장 · 끼우 화면에서 스와이프(또는 휠)하면 입력 슬롯 기준으로 리스트가 흐르며 끼울 자리가 바뀝니다.</p>
</div>
<script>
const KEY="kkiu.todo.v6", CARD_H=60, UNIT=70, GAP=92;
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const I={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.9z"/></svg>',
 starF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.9z"/></svg>',
 grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>',
 done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.3 2.3 4.7-5"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.5-3.5"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
};
const uid=()=>crypto?.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const SEED=["프로젝트 킥오프 안건 정리","디자인 시스템 컬러 토큰 검토","이번 주 회고 메모 작성","장보기 — 우유, 달걀, 커피","30분 운동하기","부모님께 안부 전화","여행 숙소 후보 비교","읽을 아티클 모아두기"]
 .map((title,i)=>({id:uid(),title,favorite:i===0,done:false,order:i,restoreIndex:i,createdAt:now(),completedAt:null}));

let state=load(), selecting=false, selected=new Set(), dragId=null, pressTimer=null;
let qOffset=0,qTT=0,qN=0,qCards=[],qMax=0,qPrevII=null,qtrackEl=null;
let dragging=false,lastY=0,lastT=0,vel=0,moved=0,raf=null,wheelT=null,didScroll=false,pressId=null;

function load(){try{const r=localStorage.getItem(KEY);if(!r)return{tasks:SEED,tab:"home",insertIndex:3,search:""};
 const p=JSON.parse(r);return{tasks:Array.isArray(p.tasks)&&p.tasks.length?p.tasks:SEED,tab:p.tab||"home",insertIndex:Number.isInteger(p.insertIndex)?p.insertIndex:0,search:""}}
 catch{return{tasks:SEED,tab:"home",insertIndex:3,search:""}}}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,tab:state.tab,insertIndex:state.insertIndex}))}
const active=()=>state.tasks.filter(t=>!t.done).sort((a,b)=>a.order-b.order);
const completed=()=>state.tasks.filter(t=>t.done).sort((a,b)=>new Date(b.completedAt||0)-new Date(a.completedAt||0));
function reindex(){active().forEach((t,i)=>t.order=i)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function hl(t,q){const s=esc(t);return q.trim()?s.replace(new RegExp("("+escRe(q.trim())+")","gi"),"<mark>$1</mark>"):s}
function fmt(iso){if(!iso)return"";const d=new Date(iso);return(d.getMonth()+1)+"월 "+d.getDate()+"일 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function vibe(p){navigator.vibrate&&navigator.vibrate(p)}
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("on"),1400)}

function addTask(v){v=v.trim();if(!v){toast("할 일을 입력해 주세요");return}
 reindex();const n=active().length;const at=clamp(state.insertIndex,0,n);
 state.tasks.forEach(t=>{if(!t.done&&t.order>=at)t.order++});
 state.tasks.push({id:uid(),title:v,favorite:false,done:false,order:at,restoreIndex:at,createdAt:now(),completedAt:null});
 reindex();state.insertIndex=at+1;save();buildHome();
 const si=document.getElementById("si");if(si){si.value="";si.focus({preventScroll:true})}
 const slot=document.querySelector(".slot");if(slot){slot.classList.add("thunk");setTimeout(()=>slot.classList.remove("thunk"),240)}
 vibe([10,16,10]);toast((at+1)+"번째 자리에 끼웠어요")}
function complete(id){reindex();const t=state.tasks.find(x=>x.id===id);if(!t||t.done)return;
 t.restoreIndex=active().findIndex(x=>x.id===id);t.done=true;t.completedAt=now();reindex();
 state.insertIndex=clamp(state.insertIndex,0,active().length);save();homeRefresh();vibe(14);toast("완료했어요")}
function restore(id){reindex();const t=state.tasks.find(x=>x.id===id);if(!t||!t.done)return;
 const at=clamp(t.restoreIndex??active().length,0,active().length);
 state.tasks.forEach(x=>{if(!x.done&&x.order>=at)x.order++});t.done=false;t.order=at;t.completedAt=null;reindex();
 state.tab="home";save();render();toast((at+1)+"번째 자리로 복원했어요")}
function favorite(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.favorite=!t.favorite;save();homeRefresh()}
function move(id,idx){reindex();const l=active();const c=l.findIndex(t=>t.id===id);if(c<0)return;
 const m=l[c];l.splice(c,1);const at=clamp(idx,0,l.length);l.splice(at,0,m);l.forEach((t,i)=>t.order=i);save();homeRefresh();toast((at+1)+"번째로 이동")}
function commitEdit(id,val){const t=state.tasks.find(x=>x.id===id);if(t&&val.trim()){t.title=val.trim();save()}homeRefresh()}
function enterSelect(id){if(!id)return;selecting=true;selected=new Set([id]);vibe(18);buildHome()}
function toggleSelect(id){selected.has(id)?selected.delete(id):selected.add(id);if(!selected.size)selecting=false;buildHome()}
function deleteSelected(){if(!selected.size)return;const c=selected.size;state.tasks=state.tasks.filter(t=>!selected.has(t.id));
 selecting=false;selected=new Set();reindex();state.insertIndex=clamp(state.insertIndex,0,active().length);save();buildHome();toast(c+"개 삭제했어요")}
function cancelSelect(){selecting=false;selected=new Set();buildHome()}
function exportJson(){const s=JSON.stringify({exportedAt:now(),tasks:state.tasks},null,2);navigator.clipboard?.writeText(s);const ta=document.getElementById("io");if(ta)ta.value=s;toast("JSON을 복사했어요")}
function importJson(){const ta=document.getElementById("io");if(!ta)return;
 try{const p=JSON.parse(ta.value);const arr=Array.isArray(p)?p:p.tasks;if(!Array.isArray(arr))throw 0;
  state.tasks=arr.map((t,i)=>({id:t.id||uid(),title:String(t.title||"제목 없음"),favorite:!!t.favorite,done:!!t.done,order:Number.isFinite(t.order)?t.order:i,restoreIndex:Number.isFinite(t.restoreIndex)?t.restoreIndex:i,createdAt:t.createdAt||now(),completedAt:t.completedAt||null}));
  reindex();state.tab="home";save();render();toast("가져오기 완료")}catch{toast("JSON 형식이 올바르지 않아요")}}
function resetAll(){if(!confirm("모든 데이터를 삭제하고 초기화할까요?"))return;localStorage.removeItem(KEY);state={tasks:SEED.map(t=>({...t,id:uid()})),tab:"home",insertIndex:3,search:""};save();render();toast("초기화했어요")}

function headHtml(){const a=active().length,d=completed().length;
 const map={home:["끼우",`${a}개의 할 일 · 완료 ${d}`],done:["완료됨",`완료한 일 ${d}개`],search:["찾기","제목으로 바로 검색"],more:["더보기","설정과 데이터 백업"]};
 const[t,s]=map[state.tab]||map.home;
 return `<div class="head"><h1 class="ttl">${t}</h1><p class="head-sub">${esc(s)}</p></div>`}
function navHtml(){const it=(id,ic,l)=>`<button class="nb ${state.tab===id?"on":""}" data-tab="${id}">${ic}<span>${l}</span></button>`;
 return `<nav class="nav">${it("home",I.home,"끼우")}${it("done",I.done,"완료됨")}${it("search",I.search,"찾기")}${it("more",I.more,"더보기")}</nav>`}
function cardHtml(t,idx,o={}){
 const top=!t.done&&idx<3?`t${idx+1}`:"";
 const lead=o.select?`<button class="selbox ${selected.has(t.id)?"on":""}" data-act="sel" data-id="${t.id}">${I.check}</button>`
  :`<button class="ck ${t.done?"on":""}" data-act="${t.done?"restore":"complete"}" data-id="${t.id}">${t.done?I.check:""}</button>`;
 const dot=(!t.done&&idx===0)?'<span class="dot"></span>':'';
 const sub=t.done?`<div class="sub">${fmt(t.completedAt)} 완료</div>`:"";
 const acts=o.select?"":`<button class="ico fav ${t.favorite?"on":""}" data-act="fav" data-id="${t.id}">${t.favorite?I.starF:I.starO}</button>${t.done?"":`<button class="ico grip" data-act="grip" data-id="${t.id}" draggable="true">${I.grip}</button>`}`;
 return `<article class="card ${top} ${t.done?"done":""} ${o.select&&selected.has(t.id)?"sel-on":""}" data-id="${t.id}">
  ${lead}<div class="mid"><div class="trow">${dot}<p class="t-title" data-act="title" data-id="${t.id}">${o.q?hl(t.title,o.q):esc(t.title)}</p></div>${sub}</div>
  <div class="acts">${acts}</div></article>`}
function slotHtml(){const n=active().length,at=clamp(state.insertIndex,0,n);
 return `<div class="slotwrap" id="slotwrap"><form class="slot" id="addForm">
  <div class="sbadge">${I.plus}</div>
  <div class="sbody"><input class="si" id="si" autocomplete="off" placeholder="새 할 일"/>
   <div class="snote"><b id="sposN">${at+1}</b>번째 자리에 끼워요 · 스와이프로 이동</div></div>
  <button class="save" type="submit">${I.arrow}</button></form></div>`}
function selBarHtml(){return `<div class="selbar"><b>${selected.size}개 선택됨</b><div class="sb-acts"><button class="sb-btn" data-act="sel-cancel">취소</button><button class="sb-btn del" data-act="sel-delete">삭제</button></div></div>`}

function buildHome(){
 cancelAnimationFrame(raf);
 if(selecting){const l=active();
  app.innerHTML=`${headHtml()}<div class="stage"><div class="scroller"><div class="list">${l.map((t,i)=>cardHtml(t,i,{select:true})).join("")}</div></div>${selBarHtml()}</div>${navHtml()}`;
  wireCards();return}
 reindex();const l=active();
 app.innerHTML=`${headHtml()}<div class="stage" id="stage">
   <div class="qvp" id="qvp"><div class="qtrack" id="qtrack">${l.map((t,i)=>cardHtml(t,i)).join("")}</div></div>
   <div class="qfade t"></div><div class="qfade b"></div>${slotHtml()}
  </div>${navHtml()}`;
 initQueue();wireCards();
}
function initQueue(){
 const stage=document.getElementById("stage"), qvp=document.getElementById("qvp");
 qtrackEl=document.getElementById("qtrack");
 const H=stage.clientHeight, line=Math.round(H*0.46);
 qTT=line-GAP/2;
 document.getElementById("slotwrap").style.top=(qTT+(GAP-UNIT+CARD_H)/2)+"px";
 qCards=[...qtrackEl.querySelectorAll(".card")];
 qN=active().length; qMax=qN*UNIT; qPrevII=null;
 qOffset=clamp(state.insertIndex*UNIT,0,qMax);
 apply();
 qvp.addEventListener("pointerdown",onDown);
 qvp.addEventListener("pointermove",onMove);
 qvp.addEventListener("pointerup",onUp);
 qvp.addEventListener("pointercancel",onUp);
 qvp.addEventListener("wheel",onWheel,{passive:false});
 qvp.addEventListener("click",e=>{if(didScroll){e.stopPropagation();e.preventDefault();didScroll=false}},true);
}
function apply(){
 const ii=clamp(Math.round(qOffset/UNIT),0,qN);
 qtrackEl.style.transform=`translateY(${qTT-qOffset}px)`;
 if(ii!==qPrevII){
  qCards.forEach((el,i)=>{el.style.transform=`translateY(${i>=ii?GAP:0}px)`});
  const pn=document.getElementById("sposN");if(pn)pn.textContent=ii+1;
  if(qPrevII!==null)vibe(6);
  qPrevII=ii;state.insertIndex=ii;
 }
}
function onDown(e){if(e.target.closest(".grip"))return;cancelAnimationFrame(raf);
 dragging=true;moved=0;didScroll=false;lastY=e.clientY;lastT=performance.now();vel=0;
 pressId=e.target.closest(".card")?.dataset.id||null;
 pressTimer=setTimeout(()=>{if(moved<8)enterSelect(pressId)},460);
 try{e.target.setPointerCapture?.(e.pointerId)}catch{}}
function onMove(e){if(!dragging)return;const y=e.clientY,dy=lastY-y;lastY=y;
 const t=performance.now(),dt=Math.max(8,t-lastT);lastT=t;moved+=Math.abs(dy);
 if(moved>8){clearTimeout(pressTimer);didScroll=true}
 qOffset=clamp(qOffset+dy,0,qMax);vel=dy/dt;apply()}
function onUp(){if(!dragging)return;dragging=false;clearTimeout(pressTimer);if(moved>8)momentum();else save()}
function momentum(){cancelAnimationFrame(raf);let last=performance.now();
 (function tick(t){const dt=Math.min(34,t-last);last=t;qOffset=clamp(qOffset+vel*dt,0,qMax);vel*=Math.pow(0.94,dt/16);apply();
  if(Math.abs(vel)>0.015&&qOffset>0&&qOffset<qMax)raf=requestAnimationFrame(tick);else snap()})(last)}
function snap(){cancelAnimationFrame(raf);const target=clamp(Math.round(qOffset/UNIT)*UNIT,0,qMax),start=qOffset,t0=performance.now(),dur=200;
 (function st(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);qOffset=start+(target-start)*e;apply();
  if(k<1)raf=requestAnimationFrame(st);else{qOffset=target;apply();save()}})(t0)}
function onWheel(e){e.preventDefault();cancelAnimationFrame(raf);qOffset=clamp(qOffset+e.deltaY,0,qMax);apply();clearTimeout(wheelT);wheelT=setTimeout(snap,110)}
function homeRefresh(){if(state.tab==="home")buildHome()}

function doneView(){const t=completed();return `<div class="scroller"><div class="list">${t.length?t.map((x,i)=>cardHtml(x,i)).join(""):`<div class="empty"><div class="empty-c"><h3>아직 완료한 일이 없어요</h3><p>끼우 화면에서 체크하면 이곳에 쌓입니다. 해제하면 원래 순번 근처로 돌아가요.</p></div></div>`}</div></div>`}
function searchResults(q,res){if(!q)return `<div class="empty"><div class="empty-c"><h3>무엇을 찾을까요?</h3><p>제목으로 바로 검색합니다. 완료된 일도 함께 찾아요.</p></div></div>`;
 if(!res.length)return `<div class="empty"><div class="empty-c"><h3>결과가 없어요</h3><p>“${esc(q)}”와 일치하는 할 일이 없습니다.</p></div></div>`;
 return res.map((t,i)=>cardHtml(t,i,{q})).join("")}
function searchView(){const q=state.search.trim();const all=[...active(),...completed()];const res=q?all.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())):[];
 return `<div class="scroller"><div class="list"><input class="field" id="sq" value="${esc(state.search)}" placeholder="검색어 입력" autocomplete="off"/><div id="sres" class="list">${searchResults(q,res)}</div></div></div>`}
function moreView(){return `<div class="scroller"><div class="list">
 <div class="pcard"><h3>3Day Weekend Lab.</h3><p>“위치가 곧 우선순위” — 버튼 없이 순서로 정리하는 심플 할일앱.</p></div>
 <button class="rbtn" data-act="link">공식 홈페이지 <span>↗</span></button>
 <button class="rbtn" data-act="link">피드백 보내기 <span>↗</span></button>
 <div class="pcard"><h3>데이터 백업</h3><p>현재 버전은 서버 없이 이 브라우저에 저장됩니다.</p></div>
 <button class="rbtn" data-act="export">JSON 내보내기 / 복사 <span>⇩</span></button>
 <textarea class="field" id="io" placeholder="가져올 JSON 붙여넣기"></textarea>
 <button class="rbtn" data-act="import">JSON 가져오기 <span>⇧</span></button>
 <button class="rbtn danger" data-act="reset">전체 초기화 <span>⟲</span></button></div></div>`}
function render(){
 if(state.tab==="home"){buildHome();setTimeout(()=>document.getElementById("si")?.focus({preventScroll:true}),50);return}
 const body=state.tab==="done"?doneView():state.tab==="search"?searchView():moreView();
 app.innerHTML=`${headHtml()}<div class="stage">${body}</div>${navHtml()}`;
 if(state.tab==="search"){const sq=document.getElementById("sq");
  sq.addEventListener("input",e=>{state.search=e.target.value;const q=state.search.trim();const all=[...active(),...completed()];const res=q?all.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())):[];document.getElementById("sres").innerHTML=searchResults(q,res);wireCards()})}
 wireCards();
}
function wireCards(){
 document.querySelectorAll("[data-act='grip']").forEach(g=>{const card=g.closest(".card");
  g.addEventListener("dragstart",()=>{dragId=card.dataset.id;card.classList.add("drag")});
  g.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".card").forEach(c=>c.classList.remove("drag"))})});
 document.querySelectorAll(".scroller .card, .list .card").forEach(card=>{
  card.addEventListener("dragover",e=>{if(dragId)e.preventDefault()});
  card.addEventListener("drop",e=>{e.preventDefault();if(!dragId)return;const tid=card.dataset.id;if(tid===dragId)return;
   const r=card.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;const l=active();const ti=l.findIndex(t=>t.id===tid);move(dragId,after?ti+1:ti)})});
}
app.addEventListener("click",e=>{
 const tab=e.target.closest("[data-tab]");
 if(tab){selecting=false;selected=new Set();state.tab=tab.dataset.tab;save();render();if(state.tab==="search")setTimeout(()=>document.getElementById("sq")?.focus(),60);return}
 const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,id=el.dataset.id;
 if(act==="title"){if(selecting)toggleSelect(id);else startEdit(el,id);return}
 if(act==="sel"){toggleSelect(id);return}
 if(selecting&&e.target.closest(".card")){toggleSelect(id);return}
 if(act==="complete")complete(id);else if(act==="restore")restore(id);else if(act==="fav")favorite(id);
 else if(act==="sel-delete")deleteSelected();else if(act==="sel-cancel")cancelSelect();
 else if(act==="export")exportJson();else if(act==="import")importJson();else if(act==="reset")resetAll();
 else if(act==="link")toast("데모에서는 외부 링크가 연결되지 않아요");
});
app.addEventListener("submit",e=>{if(e.target.id==="addForm"){e.preventDefault();addTask(document.getElementById("si").value)}});
function startEdit(el,id){if(selecting)return;const t=state.tasks.find(x=>x.id===id);
 el.setAttribute("contenteditable","true");el.textContent=t.title;el.focus();
 const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
 const fin=()=>{el.removeAttribute("contenteditable");commitEdit(id,el.textContent)};
 el.addEventListener("blur",fin,{once:true});
 el.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();el.blur()}if(ev.key==="Escape"){el.textContent=t.title;el.blur()}})}
window.addEventListener("resize",()=>{if(state.tab==="home"&&!selecting)buildHome()});
render();
setTimeout(()=>document.getElementById("si")?.focus({preventScroll:true}),80);
</script>
</body>
</html>
