<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Kkiu To Do</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<style>
  :root{
    --paper:#fbf8f2; --surface:#fff; --ink:#1c1a17; --ink2:#46423b; --sub:#938c80; --faint:#bdb6a8;
    --hair:#efe9dd; --accent:#e0894a; --accent-soft:#fbe9d5; --accent-ink:#a85e26; --danger:#c75b4e;
    --r:16px; --nav-h:62px; --safe:env(safe-area-inset-bottom,0px);
    --sh-card:0 1px 2px rgba(70,55,30,.06),0 6px 18px rgba(70,55,30,.07);
    --sh-slot:0 14px 34px rgba(80,55,25,.18); --sh-pop:0 26px 70px rgba(50,40,20,.22);
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
    background:linear-gradient(168deg,#efe9dd,#f7f2e9 46%,#ece5d8);display:grid;place-items:center;padding:24px 14px}
  button,input,textarea{font:inherit;color:inherit}
  button{-webkit-tap-highlight-color:transparent;cursor:pointer;border:0;background:none}
  .wrap{width:min(100%,416px)}
  .phone{position:relative;width:100%;height:min(884px,calc(100vh - 48px));min-height:680px;display:flex;flex-direction:column;
    overflow:hidden;border-radius:46px;background:var(--paper);border:1px solid rgba(70,55,30,.06);box-shadow:var(--sh-pop)}
  .phone::before{content:"";position:absolute;z-index:60;top:12px;left:50%;width:104px;height:28px;transform:translateX(-50%);border-radius:999px;background:rgba(70,55,30,.05)}
  #app{flex:1;display:flex;flex-direction:column;min-height:0}
  #viewport{flex:1;min-height:0;position:relative;overflow:hidden}
  .vpage{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;will-change:transform;background:var(--paper)}

  .head{flex:none;padding:46px 24px 12px}
  .ttl{margin:0;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
  .head-sub{margin:7px 0 0;font-size:13px;font-weight:560;color:var(--sub);letter-spacing:-.01em}

  .stage{flex:1;min-height:0;position:relative;overflow:hidden}
  .stage.q{touch-action:none}
  .stage.q.adding .ico.grip{opacity:.28;pointer-events:none;transition:opacity .18s}
  .qvp{position:absolute;inset:0;overflow:hidden}
  .qtrack{position:absolute;left:0;right:0;top:0;padding:0 18px;will-change:transform}
  .qfade{position:absolute;left:0;right:0;z-index:6;pointer-events:none}
  .qfade.t{top:0;height:40px;background:linear-gradient(to bottom,var(--paper) 16%,transparent)}
  .qfade.b{bottom:0;height:calc(var(--nav-h) + 64px + var(--safe));background:linear-gradient(to top,var(--paper) 52%,transparent)}

  .card{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:center;height:62px;
    margin-bottom:10px;padding:0 14px 0 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-card);
    user-select:none;transition:transform .19s cubic-bezier(.2,.7,.3,1),box-shadow .16s,opacity .26s ease}
  .card.hasrank{grid-template-columns:24px 30px 1fr auto;gap:9px;padding-left:15px}
  .card.lift{box-shadow:0 16px 40px rgba(60,45,25,.26);z-index:20}
  .card.leaving{opacity:0}
  .card.sel-on{box-shadow:0 0 0 2px var(--accent),var(--sh-card)}
  .card.t1{background:#fffdf8}
  .ck{width:24px;height:24px;border-radius:50%;border:2px solid #ddd6c7;background:transparent;display:grid;place-items:center;color:transparent;transition:.16s}
  .ck:hover{border-color:var(--accent)}.ck:active{transform:scale(.9)}
  .ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ck.pop{animation:ckpop .34s ease}
  @keyframes ckpop{0%{transform:scale(.5)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
  .ck svg{width:12px;height:12px}
  .selbox{width:24px;height:24px;border-radius:7px;border:2px solid #ddd6c7;display:grid;place-items:center;color:transparent;transition:.14s}
  .selbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .selbox svg{width:13px;height:13px}
  .rank{font-size:13px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.04em}
  .rank.top{padding:3px 0;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800}
  .card.t1 .rank{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(224,137,74,.35)}
  .mid{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .t-title{margin:0;font-size:15.5px;font-weight:580;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .card.t1 .t-title{font-weight:680}
  .t-title[contenteditable="true"]{outline:none;border-bottom:2px solid var(--accent);overflow:visible;text-overflow:clip}
  .card.done{box-shadow:none;background:rgba(255,255,255,.5)}
  .card.done .t-title{color:var(--faint);text-decoration:line-through;font-weight:540}
  .sub{margin-top:2px;font-size:11px;font-weight:560;color:var(--faint)}
  .acts{display:flex;align-items:center;gap:1px}
  .ico{width:32px;height:32px;border-radius:9px;color:var(--faint);display:grid;place-items:center;opacity:.7;transition:.14s}
  .ico:hover{background:#f4eee2;opacity:1}
  .ico svg{width:16px;height:16px;pointer-events:none}
  .ico.fav{width:40px;height:40px}.ico.fav svg{width:24px;height:24px}
  .ico.fav:active{transform:scale(.85)}.ico.fav.on{color:var(--accent);opacity:1}
  .ico.grip{color:#d2cabb;cursor:grab;touch-action:none}.ico.grip:active{cursor:grabbing}

  .slotwrap{position:absolute;left:0;right:0;z-index:30;transform:translateY(-50%);padding:0 22px;transition:opacity .16s}
  .ins{position:relative;width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:23px;
    background:var(--surface);box-shadow:var(--sh-slot);font-size:13.5px;font-weight:650;color:var(--ink2);letter-spacing:-.02em;transition:transform .14s}
  .ins:active{transform:scale(.985)}
  .ins .p{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;font-weight:600;line-height:1;padding-bottom:1px}
  .ins b{color:var(--accent-ink);font-weight:800}
  .ibar{display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--sh-slot)}
  .slotwrap.open .ins{display:none}.slotwrap.open .ibar{display:flex}
  .ipos{flex:none;min-width:30px;height:34px;padding:0 9px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .si{flex:1;min-width:0;height:34px;border:0;outline:0;background:transparent;font-size:16px;font-weight:560;letter-spacing:-.02em}
  .si::placeholder{color:var(--faint);font-weight:500}
  .save{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px rgba(224,137,74,.32);transition:.15s}
  .save:hover{filter:brightness(1.04)}.save:active{transform:scale(.9)}.save svg{width:19px;height:19px}

  .scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:6px 18px calc(var(--nav-h) + 30px + var(--safe));touch-action:pan-y}
  .scroller::-webkit-scrollbar{display:none}
  .list{display:flex;flex-direction:column;gap:10px}
  .list .card{height:auto;min-height:62px;padding:13px 16px;margin:0;animation:rowin .26s ease}
  @keyframes rowin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .list .card.hasrank{padding-left:15px}
  .list .t-title{white-space:normal;overflow-wrap:anywhere}
  .empty{display:grid;place-items:center;min-height:230px;padding:16px}
  .empty-c,.pcard{width:100%;padding:30px 26px;border-radius:20px;background:var(--surface);box-shadow:var(--sh-card)}
  .empty-c{text-align:center}
  .empty-c h3{margin:0 0 7px;font-size:18px;font-weight:680;letter-spacing:-.03em}
  .empty-c p{margin:0;font-size:13px;line-height:1.6;font-weight:560;color:var(--sub);word-break:keep-all}
  .pcard{padding:17px 18px}
  .pcard h3{margin:0 0 6px;font-size:15px;font-weight:680;letter-spacing:-.02em}
  .pcard p{margin:0;font-size:12.5px;line-height:1.6;font-weight:560;color:var(--sub);word-break:keep-all}
  .field{width:100%;background:var(--surface);border:0;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:560;outline:0;box-shadow:var(--sh-card)}
  .field:focus{box-shadow:0 0 0 2px var(--accent),var(--sh-card)}
  textarea.field{min-height:100px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
  .rbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;box-shadow:var(--sh-card);color:var(--ink);transition:.15s}
  .rbtn span{color:var(--faint)}.rbtn:hover{color:var(--accent-ink)}.rbtn:active{transform:scale(.98)}.rbtn.danger:hover{color:var(--danger)}
  mark{background:var(--accent-soft);border-radius:4px;padding:0 2px;color:var(--accent-ink)}

  .selhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:46px 20px 12px;animation:viewin .2s ease}
  @keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .selx{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);background:rgba(70,55,30,.06)}
  .selx svg{width:18px;height:18px}.selx:active{transform:scale(.92)}
  .selhead b{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .seltxt{font-size:13px;font-weight:700;color:var(--accent-ink);padding:9px 11px;border-radius:11px}.seltxt:active{transform:scale(.95)}
  .selscroll{padding-bottom:calc(var(--nav-h) + 30px + var(--safe))}
  .seldock{position:absolute;left:16px;right:16px;bottom:calc(14px + var(--safe));z-index:50;height:var(--nav-h);display:flex;gap:8px;padding:8px;border-radius:22px;background:rgba(251,248,242,.92);box-shadow:0 14px 36px rgba(60,45,25,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.55);animation:dockin .24s ease}
  @keyframes dockin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .dbtn{flex:1;border-radius:15px;font-size:14px;font-weight:700;color:var(--ink2);background:rgba(70,55,30,.05);transition:.15s}
  .dbtn.del{flex:1.6;background:var(--danger);color:#fff}.dbtn:active{transform:scale(.97)}
  .dbtn:disabled{background:rgba(70,55,30,.06);color:var(--faint)}.dbtn.del:disabled{background:rgba(70,55,30,.1);color:var(--faint)}

  .nav{position:absolute;left:16px;right:16px;bottom:calc(14px + var(--safe));z-index:50;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:22px;background:rgba(251,248,242,.86);box-shadow:0 14px 36px rgba(60,45,25,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.55)}
  #app.sel-mode .nav{display:none}
  .nav-ind{position:absolute;top:8px;height:calc(var(--nav-h) - 16px);left:8px;width:0;border-radius:16px;background:var(--accent-soft);z-index:0;transition:left .24s cubic-bezier(.22,.72,.25,1),width .24s cubic-bezier(.22,.72,.25,1)}
  .nb{position:relative;z-index:1;border-radius:16px;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:-.01em;transition:color .2s}
  .nb svg{width:21px;height:21px;transition:transform .2s}
  .nb:active{transform:scale(.93)}
  .nb.on{color:var(--accent-ink)}.nb.on svg{transform:translateY(-1px)}

  .toast{position:absolute;left:50%;bottom:96px;z-index:80;transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100% - 40px);padding:11px 17px;border-radius:999px;background:rgba(28,26,23,.94);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;transition:.2s;backdrop-filter:blur(10px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .note{margin:13px auto 0;max-width:416px;text-align:center;font-size:12px;line-height:1.5;font-weight:560;color:rgba(70,55,30,.5);word-break:keep-all}
  @media(max-width:460px){html,body{height:100dvh}body{padding:0;background:var(--paper)}.wrap{width:100%}.phone{height:100dvh;min-height:100dvh;border-radius:0;border:0;box-shadow:none}.phone::before,.note{display:none}.head,.selhead{padding-top:calc(30px + var(--safe))}}
</style>
</head>
<body>
<div class="wrap">
  <section class="phone"><div id="app"></div><div class="toast" id="toast"></div></section>
  <p class="note">localStorage 저장 · 세로 스와이프로 끼울 자리 선택(할일이 입력칸을 넘으면 햇틱) · 가로 스와이프로 탭 이동 · 손잡이 드래그로 순서 변경.</p>
</div>
<script>
const KEY="kkiu.todo", CARD_H=62, UNIT=72, GAP=80, LINE=0.70, TABS=["home","done","search","more"];
const PAGE_DUR=240, PAGE_EASE="cubic-bezier(.22,.72,.25,1)", IND_DELAY=50;
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const I={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.4l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17.3 6.5 20.3l1-6.1L3.1 9.8l6.1-.9z"/></svg>',
 starF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.4l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17.3 6.5 20.3l1-6.1L3.1 9.8l6.1-.9z"/></svg>',
 grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>',
 done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.3 2.3 4.7-5"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.5-3.5"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
};
const uid=()=>crypto?.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const SEED=["프로젝트 킷오프 안건 정리","디자인 시스템 컴러 토큰 검토","이번 주 회고 메모 작성","장보기 — 우유, 달개, 커피","30분 운동하기","부모님께 안부 전화","여행 숙소 후보 비교","읽을 아티클 모아두기"]
 .map((title,i)=>({id:uid(),title,favorite:i===0,done:false,order:i,restoreIndex:i,createdAt:now(),completedAt:null}));

let state=load(), selecting=false, selected=new Set();
let viewEl=null, switching=false;
let qOffset=0,qTT=0,qN=0,qCards=[],qMax=0,qPrevII=null,qtrackEl=null,stageEl=null,slotCenter=0;
let dragging=false,axis=null,captured=false,gx=0,gy=0,startY=0,panBase=0,lastY=0,lastT=0,vel=0,moved=0,viewW=0;
let raf=null,wheelT=null,didScroll=false,pressTimer=null,pressId=null,slotOpen=false;
let reActive=[],reFrom=0,reTo=0,reEl=null,reStageTop=0,reTrackTop=0;
let gripArmTimer=null,gripArmId=null,gripDownEvent=null,gripArmed=false;

function load(){try{const r=localStorage.getItem(KEY);if(!r)return{tasks:SEED,tab:"home",insertIndex:3};
 const p=JSON.parse(r);return{tasks:Array.isArray(p.tasks)&&p.tasks.length?p.tasks:SEED,tab:p.tab||"home",insertIndex:Number.isInteger(p.insertIndex)?p.insertIndex:0}}
 catch{return{tasks:SEED,tab:"home",insertIndex:3}}}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,tab:state.tab,insertIndex:state.insertIndex}))}
const active=()=>state.tasks.filter(t=>!t.done).sort((a,b)=>a.order-b.order);
const completed=()=>state.tasks.filter(t=>t.done).sort((a,b)=>new Date(b.completedAt||0)-new Date(a.completedAt||0));
function reindex(){active().forEach((t,i)=>t.order=i)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function hl(t,q){const s=esc(t);return q.trim()?s.replace(new RegExp("("+escRe(q.trim())+")","gi"),"<mark>$1</mark>"):s}
function fmt(iso){if(!iso)return"";const d=new Date(iso);return(d.getMonth()+1)+"월 "+d.getDate()+"일 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function vibe(p){navigator.vibrate&&navigator.vibrate(p)}
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("on"),1400)}

function addTask(v){v=v.trim();if(!v){toast("할 일을 입력해 주세요");document.getElementById("si")?.focus();return}
 reindex();const n=active().length;const at=clamp(state.insertIndex,0,n);
 state.tasks.forEach(t=>{if(!t.done&&t.order>=at)t.order++});
 state.tasks.push({id:uid(),title:v,favorite:false,done:false,order:at,restoreIndex:at,createdAt:now(),completedAt:null});
 reindex();state.insertIndex=at+1;save();buildHome();vibe([10,16,10]);toast((at+1)+"번째에 끼워요")}
function complete(id){const el=document.querySelector(`.card[data-id="${id}"]`);
 if(el){const ck=el.querySelector(".ck");if(ck)ck.classList.add("on","pop");el.classList.add("leaving");vibe(16);
  setTimeout(()=>doComplete(id),300)}else doComplete(id)}
function doComplete(id){reindex();const t=state.tasks.find(x=>x.id===id);if(!t||t.done)return;
 t.restoreIndex=active().findIndex(x=>x.id===id);t.done=true;t.completedAt=now();reindex();
 state.insertIndex=clamp(state.insertIndex,0,active().length);save();buildHome();toast("완료했어요")}
function restore(id){reindex();const t=state.tasks.find(x=>x.id===id);if(!t||!t.done)return;
 const at=clamp(t.restoreIndex??active().length,0,active().length);
 state.tasks.forEach(x=>{if(!x.done&&x.order>=at)x.order++});t.done=false;t.order=at;t.completedAt=null;reindex();
 state.tab="home";save();renderView();setNavActive();moveInd();vibe(12);toast((at+1)+"번째로 복원했어요")}
function favorite(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.favorite=!t.favorite;save();state.tab==="home"?buildHome():renderView()}
function commitEdit(id,val){const t=state.tasks.find(x=>x.id===id);if(t&&val.trim()){t.title=val.trim();save()}state.tab==="home"?buildHome():renderView()}
function enterSelect(id){selecting=true;selected=new Set(id?[id]:[]);vibe(20);buildHome()}
function toggleSelect(id){selected.has(id)?selected.delete(id):selected.add(id);vibe(8);buildHome()}
function selectAll(){const ids=active().map(t=>t.id);const all=ids.length&&ids.every(i=>selected.has(i));selected=all?new Set():new Set(ids);buildHome()}
function deleteSelected(){if(!selected.size)return;const c=selected.size;state.tasks=state.tasks.filter(t=>!selected.has(t.id));
 selecting=false;selected=new Set();reindex();state.insertIndex=clamp(state.insertIndex,0,active().length);save();buildHome();toast(c+"개 삭제했어요")}
function cancelSelect(){selecting=false;selected=new Set();buildHome()}
function exportJson(){const s=JSON.stringify({exportedAt:now(),tasks:state.tasks},null,2);navigator.clipboard?.writeText(s);const ta=document.getElementById("io");if(ta)ta.value=s;toast("JSON을 복사했어요")}
function importJson(){const ta=document.getElementById("io");if(!ta)return;
 try{const p=JSON.parse(ta.value);const arr=Array.isArray(p)?p:p.tasks;if(!Array.isArray(arr))throw 0;
  state.tasks=arr.map((t,i)=>({id:t.id||uid(),title:String(t.title||"제목 없음"),favorite:!!t.favorite,done:!!t.done,order:Number.isFinite(t.order)?t.order:i,restoreIndex:Number.isFinite(t.restoreIndex)?t.restoreIndex:i,createdAt:t.createdAt||now(),completedAt:t.completedAt||null}));
  reindex();state.tab="home";save();renderView();setNavActive();moveInd();toast("가져오기 완료")}catch{toast("JSON 형식이 올바르지 않아요")}}
function resetAll(){if(!confirm("모든 데이터를 삭제하고 초기화할까요?"))return;localStorage.removeItem(KEY);state={tasks:SEED.map(t=>({...t,id:uid()})),tab:"home",insertIndex:3};save();renderView();setNavActive();moveInd();toast("초기화했어요")}

function headHtml(){const a=active().length,d=completed().length;
 const map={home:["끼우",`${a}개의 할 일 · 완료 ${d}`],done:["완료됨",`완료한 일 ${d}개`],search:["찾기","제목으로 바로 검색"],more:["더보기","설정과 데이터 백업"]};
 const[t,s]=map[state.tab]||map.home;return `<div class="head"><h1 class="ttl">${t}</h1><p class="head-sub">${esc(s)}</p></div>`}
function cardHtml(t,idx,o={}){
 if(o.select){return `<article class="card ${selected.has(t.id)?"sel-on":""}" data-id="${t.id}">
   <button class="selbox ${selected.has(t.id)?"on":""}" data-act="sel" data-id="${t.id}">${I.check}</button>
   <div class="mid"><p class="t-title">${esc(t.title)}</p>${t.done?`<div class="sub">완료됨</div>`:""}</div><div class="acts"></div></article>`}
 const topN=(!t.done&&o.rank&&idx<3)?idx+1:0, topcls=topN?`t${topN}`:"";
 const lead=`<button class="ck ${t.done?"on":""}" data-act="${t.done?"restore":"complete"}" data-id="${t.id}">${t.done?I.check:""}</button>`;
 const rank=o.rank?`<div class="rank ${topN?"top":""}">${idx+1}</div>`:"";
 const sub=t.done?`<div class="sub">${fmt(t.completedAt)} 완료</div>`:"";
 const acts=`<button class="ico fav ${t.favorite?"on":""}" data-act="fav" data-id="${t.id}">${t.favorite?I.starF:I.starO}</button>${(o.rank&&!t.done)?`<button class="ico grip" data-act="grip" data-id="${t.id}">${I.grip}</button>`:""}`;
 return `<article class="card ${o.rank?"hasrank":""} ${topcls} ${t.done?"done":""}" data-id="${t.id}" ${o.rank?`data-idx="${idx}"`:""}>
  ${lead}${rank}<div class="mid"><p class="t-title" data-act="title" data-id="${t.id}">${o.q?hl(t.title,o.q):esc(t.title)}</p>${sub}</div>
  <div class="acts">${acts}</div></article>`}
function slotHtml(){const at=clamp(state.insertIndex,0,active().length);
 return `<div class="slotwrap" id="slotwrap">
  <button type="button" class="ins" data-act="slot-open"><span class="p">+</span><span><b id="sposN">${at+1}</b>번째에 할일 끼우기</span></button>
  <form class="ibar" id="addForm" autocomplete="off"><span class="ipos" id="sposN2">${at+1}</span>
   <input class="si" id="si" enterkeyhint="done" placeholder="할 일을 입력하고 끼우기"/><button class="save" type="submit">${I.arrow}</button></form>
 </div>`}

function buildHome(){
 cancelAnimationFrame(raf);app.classList.toggle("sel-mode",selecting);
 if(selecting){renderSelect();return}
 reindex();const l=active();
 viewEl.innerHTML=`${headHtml()}<div class="stage q" id="stage">
   <div class="qvp"><div class="qtrack" id="qtrack">${l.map((t,i)=>cardHtml(t,i,{rank:true})).join("")}</div></div>
   <div class="qfade t"></div><div class="qfade b"></div>${slotHtml()}</div>`;
 initQueue();setNavActive()
}
function renderSelect(){const l=active();const allSel=l.length&&l.every(t=>selected.has(t.id));
 viewEl.innerHTML=`<div class="selhead"><button class="selx" data-act="sel-cancel">${I.x}</button>
   <b>${selected.size?selected.size+"개 선택됨":"항목을 선택하세요"}</b>
   <button class="seltxt" data-act="sel-all">${allSel?"선택 해제":"전체 선택"}</button></div>
  <div class="stage"><div class="scroller selscroll"><div class="list">${l.map(t=>cardHtml(t,0,{select:true})).join("")}</div></div></div>
  <div class="seldock"><button class="dbtn" data-act="sel-cancel">취소</button>
   <button class="dbtn del" data-act="sel-delete" ${selected.size?"":"disabled"}>삭제${selected.size?" · "+selected.size:""}</button></div>`;
}
function renderView(){
 slotOpen=false;app.classList.toggle("sel-mode",selecting);
 if(selecting){renderSelect();return}
 if(state.tab==="home"){buildHome();return}
 const body=state.tab==="done"?doneView():state.tab==="search"?searchView():moreView();
 viewEl.innerHTML=`${headHtml()}<div class="stage">${body}</div>`;
 if(state.tab==="search"){const sq=document.getElementById("sq");
  sq.addEventListener("input",e=>{state.search=e.target.value;const q=state.search.trim();const all=[...active(),...completed()];const res=q?all.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())):[];document.getElementById("sres").innerHTML=searchResults(q,res)})}
}
function initQueue(){
 stageEl=document.getElementById("stage");qtrackEl=document.getElementById("qtrack");
 const H=stageEl.clientHeight, line=Math.round(H*LINE);
 qTT=line-GAP/2;slotCenter=line;
 const sw=document.getElementById("slotwrap");sw.style.top=line+"px";sw.style.transform="translateY(-50%)";
 qCards=[...qtrackEl.querySelectorAll(".card")];qN=active().length;qMax=qN*UNIT;qPrevII=null;
 qOffset=clamp(state.insertIndex*UNIT,0,qMax);apply();
 const si=document.getElementById("si");
 si.addEventListener("blur",()=>setTimeout(()=>{if(slotOpen&&document.activeElement!==si&&!si.value.trim())closeSlot()},160));
 if(slotOpen){sw.classList.add("open");si.focus({preventScroll:true});onVV()}
}
function apply(){const ii=clamp(Math.round(qOffset/UNIT),0,qN);
 qtrackEl.style.transform=`translateY(${qTT-qOffset}px)`;
 if(ii!==qPrevII){qCards.forEach((el,i)=>{el.style.transform=`translateY(${i>=ii?GAP:0}px)`});
  const a=document.getElementById("sposN");if(a)a.textContent=ii+1;const b=document.getElementById("sposN2");if(b)b.textContent=ii+1;
  if(qPrevII!==null)vibe(9);qPrevII=ii;state.insertIndex=ii}}

/* ── 통합 제스처: 세로=끼우기 위치(home) / 가로=탭 이동 ── */
function gDown(e){
 if(switching||selecting)return;
 if(slotOpen&&e.target.closest(".ibar"))return;
 if(slotOpen)e.preventDefault();
 axis=null;captured=false;dragging=true;moved=0;didScroll=false;gripArmed=false;gx=e.clientX;gy=e.clientY;
 startY=e.clientY;panBase=qOffset;lastY=e.clientY;lastT=performance.now();vel=0;
 pressId=e.target.closest(".card")?.dataset.id||null;
 clearTimeout(pressTimer);clearTimeout(gripArmTimer);
 const gripEl=e.target.closest(".grip");
 if(gripEl&&state.tab==="home"&&!slotOpen&&!selecting){
  gripArmId=gripEl.dataset.id;gripDownEvent=e;
  gripArmTimer=setTimeout(()=>{if(moved<8&&dragging){gripArmed=true;didScroll=true;vibe(14);startReorder(gripArmId,gripDownEvent)}},170);
 } else if(state.tab==="home"&&!slotOpen&&!e.target.closest(".ins")){
  pressTimer=setTimeout(()=>{if(moved<8)enterSelect(pressId)},460);
 }
 cancelAnimationFrame(raf)
}
function gMove(e){
 if(gripArmed){e.preventDefault();layoutReorder(e.clientY);return}
 if(!dragging)return;const dx=e.clientX-gx, dy=e.clientY-gy;moved=Math.max(moved,Math.abs(dx),Math.abs(dy));
 if(!axis){
  if(Math.abs(dx)<9&&Math.abs(dy)<9)return;clearTimeout(pressTimer);clearTimeout(gripArmTimer);
  if(Math.abs(dx)>Math.abs(dy)){ if(slotOpen){axis="dead";return} axis="h";viewW=viewEl.clientWidth;try{viewEl.setPointerCapture(e.pointerId)}catch{};didScroll=true }
  else{ if(state.tab==="home"){axis="v";try{viewEl.setPointerCapture(e.pointerId)}catch{};didScroll=true} else {axis="native";dragging=false;return} }
 }
 if(axis==="h"){e.preventDefault();const idx=TABS.indexOf(state.tab);let t=dx;
  if((idx===0&&dx>0)||(idx===TABS.length-1&&dx<0))t=dx*0.3;
  viewEl.style.transition="none";viewEl.style.transform=`translateX(${t}px)`}
 else if(axis==="v"){e.preventDefault();const total=startY-e.clientY;const tt=performance.now(),dt=Math.max(8,tt-lastT);
  vel=(lastY-e.clientY)/dt;lastY=e.clientY;lastT=tt;qOffset=clamp(panBase+total,0,qMax);apply()}
}
function gUp(e){
 clearTimeout(gripArmTimer);
 if(gripArmed){finishReorder(e);gripArmed=false;dragging=false;axis=null;clearTimeout(pressTimer);return}
 if(!dragging){axis=null;return}
 const a=axis;dragging=false;try{viewEl.releasePointerCapture(e.pointerId)}catch{}clearTimeout(pressTimer);
 if(a==="h"){const dx=e.clientX-gx;const idx=TABS.indexOf(state.tab);let dir=0;
  if(dx<-viewW*0.2&&idx<TABS.length-1)dir=1;else if(dx>viewW*0.2&&idx>0)dir=-1;
  if(dir)commitTab(TABS[idx+dir],dir);else snapBack()}
 else if(a==="v"){momentum()}
 axis=null
}
function snapBack(){viewEl.style.transition="transform .2s ease";viewEl.style.transform="translateX(0)";setTimeout(()=>viewEl.style.transition="",200)}
function goTab(tab){if(switching||selecting||tab===state.tab)return;const dir=TABS.indexOf(tab)>TABS.indexOf(state.tab)?1:-1;commitTab(tab,dir)}
function commitTab(tab,dir){
 switching=true;slotOpen=false;
 const viewport=document.getElementById("viewport");
 const w=viewport.clientWidth||viewEl.clientWidth||320;
 const outgoing=viewEl;
 const incoming=document.createElement("div");incoming.className="vpage";
 viewport.appendChild(incoming);
 viewEl=incoming;state.tab=tab;save();
 setNavActive();
 renderView();
 incoming.style.transition="none";incoming.style.transform=`translateX(${dir*w}px)`;
 void incoming.offsetWidth;
 requestAnimationFrame(()=>{
  outgoing.style.transition=`transform ${PAGE_DUR}ms ${PAGE_EASE}`;
  incoming.style.transition=`transform ${PAGE_DUR}ms ${PAGE_EASE}`;
  outgoing.style.transform=`translateX(${-dir*w}px)`;
  incoming.style.transform="translateX(0)";
 });
 setTimeout(moveInd,IND_DELAY);
 setTimeout(()=>{
  outgoing.remove();
  incoming.style.transition="";incoming.style.transform="";
  switching=false;
  if(tab==="search")document.getElementById("sq")?.focus();
 },PAGE_DUR+30);
}

function momentum(){cancelAnimationFrame(raf);let last=performance.now();
 (function tick(t){const dt=Math.min(34,t-last);last=t;qOffset=clamp(qOffset+vel*dt,0,qMax);vel*=Math.pow(0.94,dt/16);apply();
  if(Math.abs(vel)>0.015&&qOffset>0&&qOffset<qMax)raf=requestAnimationFrame(tick);else snap()})(last)}
function snap(){cancelAnimationFrame(raf);const target=clamp(Math.round(qOffset/UNIT)*UNIT,0,qMax),start=qOffset,t0=performance.now(),dur=200;
 (function st(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);qOffset=start+(target-start)*e;apply();
  if(k<1)raf=requestAnimationFrame(st);else{qOffset=target;apply();save()}})(t0)}
function onWheel(e){if(state.tab!=="home"||selecting)return;e.preventDefault();cancelAnimationFrame(raf);qOffset=clamp(qOffset+e.deltaY,0,qMax);apply();clearTimeout(wheelT);wheelT=setTimeout(snap,110)}

function openSlot(){const sw=document.getElementById("slotwrap");if(!sw)return;slotOpen=true;sw.classList.add("open");stageEl?.classList.add("adding");
 document.getElementById("si").focus({preventScroll:true});setTimeout(onVV,60)}
function closeSlot(){const sw=document.getElementById("slotwrap");slotOpen=false;if(sw){sw.classList.remove("open");resetSlotPos()}stageEl?.classList.remove("adding")}
function resetSlotPos(){const sw=document.getElementById("slotwrap");if(!sw)return;sw.style.bottom="";sw.style.top=slotCenter+"px";sw.style.transform="translateY(-50%)"}
function onVV(){const sw=document.getElementById("slotwrap");const vv=window.visualViewport;if(!sw||!slotOpen||!vv)return;
 const kb=window.innerHeight-vv.height-vv.offsetTop;if(kb>80){sw.style.top="auto";sw.style.transform="none";sw.style.bottom=(kb+12)+"px"}else resetSlotPos()}
if(window.visualViewport){window.visualViewport.addEventListener("resize",onVV);window.visualViewport.addEventListener("scroll",onVV)}

function startReorder(id,e){
 cancelAnimationFrame(raf);
 reActive=active();reFrom=reActive.findIndex(t=>t.id===id);if(reFrom<0){gripArmed=false;return}
 reTo=reFrom;
 reEl=qtrackEl.querySelector(`.card[data-idx="${reFrom}"]`);if(!reEl){gripArmed=false;return}
 reStageTop=stageEl.getBoundingClientRect().top;reTrackTop=qTT-qOffset;
 document.getElementById("slotwrap").style.opacity="0";
 qCards.forEach(el=>el.style.transition="transform .16s cubic-bezier(.2,.7,.3,1)");
 reEl.style.transition="none";reEl.classList.add("lift");
 try{viewEl.setPointerCapture(e.pointerId)}catch{}
 layoutReorder(e.clientY)}
function layoutReorder(py){const yT=(py-reStageTop)-reTrackTop;
 reEl.style.transform=`translateY(${yT-reFrom*UNIT-CARD_H/2}px) scale(1.03)`;
 const to=clamp(Math.round((yT-CARD_H/2)/UNIT),0,reActive.length-1);if(to!==reTo){reTo=to;vibe(6)}
 qCards.forEach(el=>{if(el===reEl)return;const i=+el.dataset.idx;let s=0;
  if(reFrom<reTo){if(i>reFrom&&i<=reTo)s=-UNIT}else if(reFrom>reTo){if(i>=reTo&&i<reFrom)s=UNIT}
  el.style.transform=`translateY(${s}px)`})}
function finishReorder(e){try{viewEl.releasePointerCapture(e.pointerId)}catch{}
 const arr=reActive.slice();const[m]=arr.splice(reFrom,1);arr.splice(reTo,0,m);arr.forEach((t,i)=>t.order=i);
 state.insertIndex=clamp(state.insertIndex,0,arr.length);save();const didMove=reTo!==reFrom;reEl=null;
 buildHome();if(didMove){vibe(12);toast((reTo+1)+"번째로 이동")}}

function doneView(){const t=completed();return `<div class="scroller"><div class="list">${t.length?t.map((x,i)=>cardHtml(x,i)).join(""):`<div class="empty"><div class="empty-c"><h3>아직 완료한 일이 없어요</h3><p>끼우 화면에서 체크하면 이곳에 쌓입니다. 해제하면 원래 순번 근처로 돌아가요.</p></div></div>`}</div></div>`}
function searchResults(q,res){if(!q)return `<div class="empty"><div class="empty-c"><h3>무엇을 찾을까요?</h3><p>제목으로 바로 검색합니다. 완료된 일도 함께 찾아요.</p></div></div>`;
 if(!res.length)return `<div class="empty"><div class="empty-c"><h3>결과가 없어요</h3><p>“${esc(q)}”와 일치하는 할 일이 없습니다.</p></div></div>`;
 return res.map((t,i)=>cardHtml(t,i,{q})).join("")}
function searchView(){const q=(state.search||"").trim();const all=[...active(),...completed()];const res=q?all.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())):[];
 return `<div class="scroller"><div class="list"><input class="field" id="sq" value="${esc(state.search||"")}" placeholder="검색어 입력" autocomplete="off"/><div id="sres" class="list">${searchResults(q,res)}</div></div></div>`}
function moreView(){return `<div class="scroller"><div class="list">
 <div class="pcard"><h3>3Day Weekend Lab.</h3><p>“위치가 곳 우선순위” — 버튼 없이 순서로 정리하는 심플할일앱.</p></div>
 <button class="rbtn" data-act="link">공식 홈페이지 <span>↗</span></button>
 <button class="rbtn" data-act="link">피드백 보내기 <span>↗</span></button>
 <div class="pcard"><h3>데이터 백업</h3><p>현재 버전은 서버 없이 이 브라우저(localStorage)에 저장됩니다.</p></div>
 <button class="rbtn" data-act="export">JSON 내보내기 / 복사 <span>⇩</span></button>
 <textarea class="field" id="io" placeholder="가져올 JSON 붙여넣기"></textarea>
 <button class="rbtn" data-act="import">JSON 가져오기 <span>⇧</span></button>
 <button class="rbtn danger" data-act="reset">전체 초기화 <span>⟲</span></button></div></div>`}

function setNavActive(){document.querySelectorAll("#nav .nb").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab))}
function moveInd(){if(selecting)return;const nav=document.getElementById("nav");if(!nav)return;const ind=document.getElementById("navInd");const btn=nav.querySelector(`.nb[data-tab="${state.tab}"]`);if(btn&&ind){ind.style.left=btn.offsetLeft+"px";ind.style.width=btn.offsetWidth+"px"}}

function startEdit(el,id,ev){if(selecting)return;const t=state.tasks.find(x=>x.id===id);if(!t)return;
 el.setAttribute("contenteditable","true");el.textContent=t.title;el.focus();
 let placed=false;try{let range=null;
  if(document.caretRangeFromPoint)range=document.caretRangeFromPoint(ev.clientX,ev.clientY);
  else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(ev.clientX,ev.clientY);if(p){range=document.createRange();range.setStart(p.offsetNode,p.offset)}}
  if(range){range.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(range);placed=true}}catch{}
 if(!placed){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
 const fin=()=>{el.removeAttribute("contenteditable");commitEdit(id,el.textContent)};
 el.addEventListener("blur",fin,{once:true});
 el.addEventListener("keydown",e2=>{if(e2.key==="Enter"){e2.preventDefault();el.blur()}if(e2.key==="Escape"){el.textContent=t.title;el.blur()}})}

function mount(){
 app.innerHTML=`<div id="viewport"></div>
  <nav class="nav" id="nav"><div class="nav-ind" id="navInd"></div>
   <button class="nb" data-tab="home">${I.home}<span>끼우</span></button>
   <button class="nb" data-tab="done">${I.done}<span>완료됨</span></button>
   <button class="nb" data-tab="search">${I.search}<span>찾기</span></button>
   <button class="nb" data-tab="more">${I.more}<span>더보기</span></button></nav>`;
 const viewport=document.getElementById("viewport");
 viewEl=document.createElement("div");viewEl.className="vpage";viewport.appendChild(viewEl);
 viewport.addEventListener("pointerdown",gDown);
 viewport.addEventListener("pointermove",gMove);
 viewport.addEventListener("pointerup",gUp);
 viewport.addEventListener("pointercancel",gUp);
 viewport.addEventListener("wheel",onWheel,{passive:false});
 viewport.addEventListener("click",e=>{if(didScroll){e.stopPropagation();e.preventDefault();didScroll=false}},true);
 renderView();setNavActive();requestAnimationFrame(moveInd);
}
app.addEventListener("click",e=>{
 const tab=e.target.closest("[data-tab]");if(tab){goTab(tab.dataset.tab);return}
 const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,id=el.dataset.id;
 if(act==="slot-open"){openSlot();return}
 if(act==="title"){if(selecting)toggleSelect(id);else startEdit(el,id,e);return}
 if(act==="sel"){toggleSelect(id);return}
 if(selecting&&e.target.closest(".card")){toggleSelect(id);return}
 if(act==="complete")complete(id);else if(act==="restore")restore(id);else if(act==="fav")favorite(id);
 else if(act==="sel-delete")deleteSelected();else if(act==="sel-cancel")cancelSelect();else if(act==="sel-all")selectAll();
 else if(act==="export")exportJson();else if(act==="import")importJson();else if(act==="reset")resetAll();
 else if(act==="link")toast("데모에서는 외부 링크가 연결되지 않아요");
});
app.addEventListener("submit",e=>{if(e.target.id==="addForm"){e.preventDefault();addTask(document.getElementById("si").value)}});
window.addEventListener("resize",()=>{moveInd();if(state.tab==="home"&&!selecting&&!slotOpen)buildHome()});
mount();
</script>
</body>
